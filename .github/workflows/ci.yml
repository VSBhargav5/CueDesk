name: CueDesk offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install packages without lifecycle scripts or runtime downloads
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check study desktop syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/renderer/renderer.js
      - name: Run offline regressions
        run: npm test
      - name: Prepare official Electron runtime for the Windows smoke check
        if: runner.os == 'Windows' && matrix.node == '24'
        run: node node_modules/electron/install.js
      - name: Exercise the real study renderer and IPC with synthetic text
        if: runner.os == 'Windows' && matrix.node == '24'
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && matrix.node == '24'
        with:
          name: cuedesk-study-preview
          path: out/study-desktop.png
